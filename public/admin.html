<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>136 STUDIO｜予約管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17212c;font-family:system-ui,sans-serif}header{background:#142129;color:white;padding:16px;display:flex;justify-content:space-between}header a{color:white}main{padding:18px;max-width:1500px;margin:auto}.card{padding:20px;background:white;border-radius:14px;margin-bottom:16px}input,select,button{font:inherit;padding:10px;border:1px solid #ccd3da;border-radius:7px}label{display:block;margin:12px 0 5px}input{width:100%;max-width:450px}button{cursor:pointer}.primary{background:#142129;color:white}.hidden{display:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.scroll{overflow:auto;max-height:70vh}table{border-collapse:separate;border-spacing:3px;min-width:100%;font-size:12px}th{position:sticky;top:0;background:white;z-index:2;padding:8px}th:first-child,td:first-child{position:sticky;left:0;background:white;z-index:3;min-width:90px}td{min-width:105px}td button{width:100%;min-height:66px;padding:7px;font-size:12px;border:0;background:#e6f5ed;text-align:left}.booked{background:#ffe4bc!important}.buffer{background:#eceff2!important;color:#667}.selected{outline:3px solid #1675d1;background:#dcefff!important}.legend{font-size:13px;color:#52606d}.detail{border-top:1px solid #ddd;padding:15px 0}.contact{overflow-wrap:anywhere}#message{white-space:pre-line}button:disabled{opacity:.55;cursor:default}.bar{position:sticky;bottom:0;background:white;padding:15px;border-top:1px solid #ddd}.cancel{color:#ad302d}
</style></head><body><header><b>136 STUDIO｜予約管理</b><a href="/">予約サイトへ</a></header><main>
<section id="adminLogin" class="card"><h1>管理者ログイン</h1><p>管理者に指定された会員アカウントでログインしてください。</p><form id="loginForm"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required><label for="password">暗証番号・パスワード</label><input id="password" type="password" autocomplete="current-password" required><p><button class="primary" id="loginButton">管理者としてログイン</button></p></form></section>
<section id="dashboard" class="hidden"><div class="card"><div class="toolbar"><h1>月間予約表</h1><input id="month" type="month" aria-label="表示する月"><select id="room" aria-label="部屋"><option value="A">136スタジオ</option><option value="B">136パーソナルトレーニングスペース</option></select><button id="refresh">更新</button><button id="logout">ログアウト</button></div><p class="legend">予約は今日から3カ月先まで。緑：空き／橙：予約／灰：準備・片付け、または受付期間外。同じ日の開始枠と最後の枠をタップすると、間の時間もまとめて選べます。別の日の枠も続けて選択でき、1枠90分（利用60分＋前後15分）、1,200円です。隣り合う枠も予約でき、まとめて登録されます。予約枠をタップすると下に申込者と連絡先を表示します。</p><div class="scroll" id="calendar" aria-label="月間の時間別予約表"></div><div class="bar"><label for="customer">予約する会員</label><select id="customer"></select><p id="selection">時間枠を選択してください。</p><button class="primary" id="save">選択した枠を予約</button> <button id="clear">選択解除</button></div></div><div class="card"><h2>予約詳細・申込者</h2><p>登録済み・支払い待ちの予約です。支払いは別途確認してください。</p><div id="details"></div></div></section><p id="message" role="status"></p></main><script src="/admin.js" defer></script></body></html>
